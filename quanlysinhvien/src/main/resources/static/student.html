<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="row mb-3 align-items-center">
        <div class="col-md-4">
            <h3 class="fw-bold text-primary">Danh sách sinh viên</h3>
        </div>
        <div class="col-md-8 text-end d-flex gap-2 justify-content-end">
            <input type="text" id="searchInput" class="form-control w-50" placeholder="Nhập từ khóa tìm kiếm...">
            <button class="btn btn-primary" onclick="searchStudents()">
                <i class="bi bi-search"></i> Tìm kiếm
            </button>
            <button class="btn btn-success" onclick="openModal()">
                <i class="bi bi-plus-circle"></i> Thêm sinh viên
            </button>
        </div>
    </div>

    <table class="table table-hover table-bordered align-middle shadow-sm">
        <thead class="table-light">
        <tr>
            <th style="width: 15%;">Mã sinh viên</th>
            <th style="width: 20%;">Họ và tên</th>
            <th style="width: 20%;">Email</th>
            <th style="width: 15%;">Số điện thoại</th>
            <th style="width: 10%;">Lớp</th>
            <th style="width: 20%;" class="text-center">Hành động</th>
        </tr>
        </thead>
        <tbody id="studentTableBody">
        <tr>
            <td colspan="6" class="text-center text-muted">Đang tải dữ liệu...</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal Form Thêm / Sửa Sinh Viên -->
<div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Thêm sinh viên mới</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="studentForm">
          <input type="hidden" id="studentId">
          <div class="mb-3">
            <label class="form-label">Mã sinh viên</label>
            <input type="text" class="form-control" id="studentCode" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Họ và tên</label>
            <input type="text" class="form-control" id="fullName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="text" class="form-control" id="phone">
          </div>
          <div class="mb-3">
            <label class="form-label">Lớp</label>
            <input type="text" class="form-control" id="className">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-primary" onclick="saveStudent()">Lưu lại</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./students.js"></script>
</body>
</html>
